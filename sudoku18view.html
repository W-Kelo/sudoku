<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<title>Sudoku 18x18</title>

<style>
body{
  margin:0;
  background:#f0f2f5;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial, sans-serif;
}

table{
  border-collapse:collapse;
  width:95vmin;
  height:95vmin;
  table-layout:fixed;
  background:white;
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

td{
  border:1px solid #888;
  position:relative;
  font-weight:bold;
  font-size:calc(50vmin / 18);
}

td span{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.bold-r{ border-right:3px solid black; }
.bold-b{ border-bottom:3px solid black; }

.solution { color:#4CAF50; }
</style>
</head>

<body>
<table id="board"></table>

<script>
function get(name){
  return new URLSearchParams(location.search).get(name);
}

function render18(arr,isSolution){
  const table=document.getElementById("board");
  table.innerHTML="";

  arr.forEach((row,r)=>{
    const tr=document.createElement("tr");

    row.forEach((cell,c)=>{
      const td=document.createElement("td");
      const span=document.createElement("span");

      if(cell !== 0){
        span.textContent = cell;
        if(isSolution) span.className="solution";
      }

      if((c+1)%6===0 && c<17) td.classList.add("bold-r");
      if((r+1)%3===0 && r<17) td.classList.add("bold-b");

      td.appendChild(span);
      tr.appendChild(td);
    });

    table.appendChild(tr);
  });
}

const board = JSON.parse(get("board"));
const isSolution = get("solution")==="1";

render18(board,isSolution);
</script>
</body>
</html>
