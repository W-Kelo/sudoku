<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
 <link rel="icon" type="image/png" href="favicon.png">
<title>Sudoku 18×18 – tryb rozwiązywania, wersja beta</title>

<style>

:root{
  --bg:#f0f2f5;
  --fg:#222;
  --board-bg:white;
  --good:#c8facc;
  --bad:#ffd4d4;
  --overlay:rgba(255,255,255,0.82);
}

/* ====== layout ====== */

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
}

#layout{
  display:grid;
  grid-template-columns: 280px 1fr;
  width:100%;
  height:100%;
}

/* ====== tools column ====== */

#tools{
  border-right:1px solid #ccc;
  padding:12px;
  overflow-y:auto;
}

.tool-group{
  margin-bottom:14px;
  padding-bottom:9px;
  border-bottom:1px solid #ddd;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#007BFF;
  color:white;
  cursor:pointer;
  margin-top:4px;
  width:100%;
}

/* ====== board column ====== */

#boardCol{
  position:relative;
  overflow:auto;   /* suwaki poprawione */
  display:flex;
  justify-content:center;
  align-items:center;
}

/* plansza wrap do zoomu */

#boardWrap{
  transform-origin: top left;
  transition: transform .15s ease;
}

/* overlay paywall */

#boardOverlay{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  backdrop-filter: blur(7px);
  background:var(--overlay);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  z-index:3;
  font-weight:bold;
}

#boardOverlay.hidden{
  display:none;
}

/* tabela */

table{
  border-collapse:collapse;
  background:var(--board-bg);
}

td{
  border:1px solid #888;
  position:relative;
  width:38px;
  height:38px;
}

input{
  width:100%;
  height:100%;
  border:none;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  background:transparent;
}

input.ok{background:var(--good);}
input.bad{background:var(--bad);}

.bold-r{border-right:3px solid black;}
.bold-b{border-bottom:3px solid black;}

/* ===== toast ===== */

#toasts{
  position:fixed;
  right:15px;
  bottom:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:10;
}

.toast{
  padding:10px 14px;
  background:#333;
  color:white;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  opacity:.95;
}

/* ===== modal ===== */

#modalOverlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:20;
}

#modal{
  background:white;
  border-radius:12px;
  padding:18px 22px;
  max-width:420px;
  text-align:center;
}

#modal h3{
  margin-top:0;
}

/* ===== responsive ===== */

@media(max-width:900px){
  #layout{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }
  #tools{
    border-right:none;
    border-bottom:1px solid #ccc;
  }
}
</style>
</head>

<body>

<div id="layout">

  <div id="tools">

    <h2>Narzędzia</h2>

    <div class="tool-group">
      <button id="start">Start czasu</button>
      <button id="stop">Stop czasu</button>
      <div id="timer">00:00</div>
    </div>

    <div class="tool-group">
      <button id="modeInstant">Tryb: sprawdzaj od razu</button>
      <button id="modeLater">Tryb: najpierw rozwiąż</button>
    </div>

    <div class="tool-group">
      <button id="hint">Podpowiedź</button>
    </div>

    <div class="tool-group">
      <button id="zoomIn">Powiększ</button>
      <button id="zoomOut">Pomniejsz</button>
    </div>

    <div class="tool-group">
      <button id="save">Zapisz stan gry</button>
    </div>

    <div class="tool-group">
      <button id="sound">Dźwięk: włączony</button>
    </div>

    <div id="msg"></div>

  </div>

  <div id="boardCol">

    <div id="boardOverlay">Rozpocznij czas aby grać</div>

    <div id="boardWrap">
      <table id="board"></table>
    </div>

  </div>

</div>

<div id="toasts"></div>

<div id="modalOverlay">
  <div id="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<script>
/* ===== utils ===== */

function toast(text){
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=text;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function openModal(title,text){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalText").textContent=text;
  document.getElementById("modalOverlay").style.display="flex";
}

function closeModal(){
  document.getElementById("modalOverlay").style.display="none";
}

/* ===== input ===== */

function get(name){
  return new URLSearchParams(location.search).get(name);
}

const initialBoard = JSON.parse(get("board"));
const workBoard = JSON.parse(JSON.stringify(initialBoard));

/* ===== localStorage save ===== */

document.getElementById("save").onclick=()=>{
  localStorage.setItem("sudoku18_state",JSON.stringify(workBoard));
  toast("Stan gry zapisany");
};

/* ===== TIMER ===== */

let seconds=0,timerInt=null,started=false;

function updateTimer(){
  seconds++;
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

start.onclick=()=>{
  if(!timerInt){
    timerInt=setInterval(updateTimer,1000);
    started=true;
    boardOverlay.classList.add("hidden");
  }
};

stop.onclick=()=>{
  clearInterval(timerInt);
  timerInt=null;
  boardOverlay.textContent="Czas zatrzymany";
  boardOverlay.classList.remove("hidden");
};

/* ===== AUDIO ===== */

let audioCtx;
let soundEnabled=true;

sound.onclick=()=>{
  soundEnabled=!soundEnabled;
  sound.textContent= soundEnabled ? "Dźwięk: włączony" : "Dźwięk: wyłączony";
};

function beep(freq){
  if(!soundEnabled) return;

  if(!audioCtx)
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  if(audioCtx.state==="suspended")
    audioCtx.resume();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.2);
}

/* ===== LOGIKA ===== */

function isValid(board,r,c,val){
  for(let i=0;i<18;i++)
    if(board[r][i]===val && i!==c) return false;

  for(let i=0;i<18;i++)
    if(board[i][c]===val && i!==r) return false;

  const br=Math.floor(r/3)*3;
  const bc=Math.floor(c/6)*6;

  for(let i=0;i<3;i++)
    for(let j=0;j<6;j++){
      const rr=br+i,cc=bc+j;
      if(board[rr][cc]===val && !(rr===r&&cc===c))
        return false;
    }

  return true;
}

/* ===== RENDER BOARD ===== */

const table=document.getElementById("board");

for(let r=0;r<18;r++){
  const tr=document.createElement("tr");

  for(let c=0;c<18;c++){
    const td=document.createElement("td");

    if((c+1)%6===0 && c<17) td.classList.add("bold-r");
    if((r+1)%3===0 && r<17) td.classList.add("bold-b");

    const input=document.createElement("input");

    if(initialBoard[r][c]!==0){
      input.value=initialBoard[r][c];
      input.disabled=true;
    } else {
      input.addEventListener("input",()=>onInput(r,c,input));
    }

    td.appendChild(input);
    tr.appendChild(td);
  }

  table.appendChild(tr);
}

/* ===== TRYBY ===== */

let mode="later";

modeInstant.onclick=()=>{
  mode="instant";
  toast("Tryb: sprawdzaj od razu");
};

modeLater.onclick=()=>{
  mode="later";
  toast("Tryb: najpierw rozwiąż");
};

/* ===== INPUT HANDLER ===== */

function onInput(r,c,input){

  if(!started){
    boardOverlay.textContent="Rozpocznij czas aby grać";
    boardOverlay.classList.remove("hidden");
    input.value="";
    return;
  }

  let v=input.value.trim();
  if(v===""){workBoard[r][c]=0;return;}

  if(!/^[0-9]{1,2}$/.test(v)){input.value="";return;}

  const num=parseInt(v);
  if(num<1||num>18){input.value="";return;}

  workBoard[r][c]=num;

  if(mode==="instant"){
    if(isValid(workBoard,r,c,num)){
      input.classList.add("ok");
      input.classList.remove("bad");
      beep(900);
    } else {
      input.classList.add("bad");
      input.classList.remove("ok");
      beep(200);
    }
  }

  checkFinished();
}

/* ===== ZOOM ===== */

let zoom=1;

zoomIn.onclick=()=>{
  zoom*=1.25;
  boardWrap.style.transform=`scale(${zoom})`;
  boardCol.scrollTop=0; /* pozwala wrócić do góry */
};

zoomOut.onclick=()=>{
  zoom/=1.25;
  boardWrap.style.transform=`scale(${zoom})`;
};

/* ===== PODPOWIEDŹ – NAPRAWIONA ===== */

hint.onclick=()=>{

  const empty=[];

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++)
      if(workBoard[r][c]===0)
        empty.push([r,c]);

  if(!empty.length){
    toast("Brak pustych pól");
    return;
  }

  const [r,c]=empty[Math.floor(Math.random()*empty.length)];

  for(let v=1;v<=18;v++){
    if(isValid(workBoard,r,c,v)){
      workBoard[r][c]=v;
      const inp=table.rows[r].cells[c].firstChild;
      inp.value=v;
      inp.classList.add("ok");
      beep(1000);
      break;
    }
  }

  checkFinished();
};

/* ===== SPRAWDZENIE KOŃCA GRY ===== */

function checkFinished(){

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++){
      const v=workBoard[r][c];
      if(v===0) return;
      if(!isValid(workBoard,r,c,v)) return;
    }

  beep(1300);

  openModal(
    "Gratulacje!",
    "Rozwiązałeś poprawnie sudoku 18×18!"
  );
}
</script>
</body>
</html>
