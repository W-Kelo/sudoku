<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
 <link rel="icon" type="image/png" href="favicon.png">
<title>Sudoku 18×18 – tryb rozwiązywania, wersja beta</title>

<style>

:root{
  --bg:#f0f2f5;
  --fg:#222;
  --board-bg:white;
  --good:#c8facc;
  --bad:#ffd4d4;
  --overlay:rgba(255,255,255,0.75);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
}

/* ====== główny grid ====== */
#layout{
  display:grid;
  grid-template-columns: 280px 1fr;
  width:100%;
  height:100%;
}

/* ====== lewa kolumna – narzędzia ====== */
#tools{
  border-right:1px solid #ccc;
  padding:12px;
  overflow-y:auto;
}

#tools h2{
  margin-top:0;
}

.tool-group{
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid #ddd;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#007BFF;
  color:white;
  cursor:pointer;
  margin:2px 0;
  width:100%;
}

/* ====== prawa kolumna – plansza ====== */
#boardCol{
  position:relative;
  overflow:auto; /* suwaki tylko tu */
  display:flex;
  justify-content:center;
  align-items:center;
}

/* kontener powiększenia */
#boardWrap{
  transition: transform .2s ease;
}

/* mgła przy stopie lub braku startu */
#overlay{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  backdrop-filter: blur(6px);
  background:var(--overlay);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  z-index:2;
  pointer-events:none;
  opacity:1;
}

#overlay.hidden{
  opacity:0;
  pointer-events:none;
}

/* tabela sudoku */
table{
  border-collapse:collapse;
  background:var(--board-bg);
}

td{
  border:1px solid #888;
  position:relative;
  width:38px;
  height:38px;
}

input{
  width:100%;
  height:100%;
  border:none;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  background:transparent;
}

input:focus{
  outline:2px solid #007BFF;
}

input.ok{background:var(--good);}
input.bad{background:var(--bad);}

.bold-r{border-right:3px solid black;}
.bold-b{border-bottom:3px solid black;}

/* ===== RESPONSYWNOŚĆ ====== */
@media(max-width:900px){
  #layout{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }
  #tools{
    border-right:none;
    border-bottom:1px solid #ccc;
  }
}
</style>
</head>

<body>

<div id="layout">

  <div id="tools">
    <h2>Narzędzia</h2>

    <div class="tool-group">
      <button id="start">Start czasu</button>
      <button id="stop">Stop czasu</button>
      <div id="timer">00:00</div>
    </div>

    <div class="tool-group">
      <button id="modeInstant">Tryb: sprawdzaj od razu</button>
      <button id="modeLater">Tryb: najpierw rozwiąż</button>
    </div>

    <div class="tool-group">
      <button id="zoomIn">Powiększ</button>
      <button id="zoomOut">Pomniejsz</button>
    </div>

    <div class="tool-group">
      <button id="hint">Podpowiedź</button>
    </div>

    <div class="tool-group">
      <button id="sound">Dźwięk: włączony</button>
    </div>

    <div id="msg"></div>
  </div>

  <div id="boardCol">
    <div id="overlay">Rozpocznij czas aby grać</div>

    <div id="boardWrap">
      <table id="board"></table>
    </div>
  </div>

</div>

<script>

/* ====== PARAMETR ====== */
function get(name){
  return new URLSearchParams(location.search).get(name);
}

const initialBoard = JSON.parse(get("board"));
const workBoard = JSON.parse(JSON.stringify(initialBoard));

/* ====== TIMER ====== */
let seconds=0,timerInt=null,started=false;

function updateTimer(){
  seconds++;
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  document.getElementById("timer").textContent =
    String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

document.getElementById("start").onclick=()=>{
  if(!timerInt){
    timerInt=setInterval(updateTimer,1000);
    started=true;
    document.getElementById("overlay").classList.add("hidden");
  }
};

document.getElementById("stop").onclick=()=>{
  clearInterval(timerInt);
  timerInt=null;
  document.getElementById("overlay").textContent="Czas zatrzymany";
  document.getElementById("overlay").classList.remove("hidden");
};

/* ===== AUDIO STABILNE ===== */
let audioCtx;
function beep(freq){
  if(!soundEnabled) return;

  if(!audioCtx)
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  if(audioCtx.state==="suspended")
    audioCtx.resume();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.2);
}

let soundEnabled=true;
document.getElementById("sound").onclick=()=>{
  soundEnabled=!soundEnabled;
  document.getElementById("sound").textContent =
    soundEnabled ? "Dźwięk: włączony" : "Dźwięk: wyłączony";
};

/* ===== LOGIKA ===== */
function isValid(board,r,c,val){
  for(let i=0;i<18;i++) if(board[r][i]===val && i!==c) return false;
  for(let i=0;i<18;i++) if(board[i][c]===val && i!==r) return false;

  const br=Math.floor(r/3)*3;
  const bc=Math.floor(c/6)*6;

  for(let i=0;i<3;i++)
    for(let j=0;j<6;j++){
      const rr=br+i, cc=bc+j;
      if(board[rr][cc]===val && !(rr===r&&cc===c)) return false;
    }

  return true;
}

/* ===== RYSOWANIE PLANSZY ===== */
const table=document.getElementById("board");

for(let r=0;r<18;r++){
  const tr=document.createElement("tr");
  for(let c=0;c<18;c++){
    const td=document.createElement("td");

    if((c+1)%6===0 && c<17) td.classList.add("bold-r");
    if((r+1)%3===0 && r<17) td.classList.add("bold-b");

    const input=document.createElement("input");

    if(initialBoard[r][c]!==0){
      input.value=initialBoard[r][c];
      input.disabled=true;
    } else {
      input.addEventListener("input",()=>onInput(r,c,input));
    }

    td.appendChild(input);
    tr.appendChild(td);
  }
  table.appendChild(tr);
}

/* ===== TRYBY ===== */
let mode="later";

document.getElementById("modeInstant").onclick=()=>{
  mode="instant";
  msg.textContent="Tryb: sprawdzaj od razu";
};
document.getElementById("modeLater").onclick=()=>{
  mode="later";
  msg.textContent="Tryb: najpierw rozwiąż";
};

/* ===== WPISYWANIE ===== */
function onInput(r,c,input){

  if(!started){
    document.getElementById("overlay").textContent="Rozpocznij czas aby grać";
    document.getElementById("overlay").classList.remove("hidden");
    input.value="";
    return;
  }

  let v=input.value.trim();
  if(v==="" ){ workBoard[r][c]=0; return; }

  if(!/^[0-9]{1,2}$/.test(v)){ input.value=""; return; }

  const num=parseInt(v);
  if(num<1||num>18){ input.value=""; return; }

  workBoard[r][c]=num;

  if(mode==="instant"){
    if(isValid(workBoard,r,c,num)){
      input.classList.add("ok");
      input.classList.remove("bad");
      beep(900);
    } else {
      input.classList.add("bad");
      input.classList.remove("ok");
      beep(200);
    }
  }

  checkFinished();
}

/* ===== ZOOM PLANSZY ===== */
let zoom=1;

document.getElementById("zoomIn").onclick=()=>{
  zoom*=1.2;
  document.getElementById("boardWrap").style.transform=`scale(${zoom})`;
};

document.getElementById("zoomOut").onclick=()=>{
  zoom/=1.2;
  document.getElementById("boardWrap").style.transform=`scale(${zoom})`;
};

/* ===== KONIEC GRY ===== */
function checkFinished(){
  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++){
      const v=workBoard[r][c];
      if(v===0) return;
      if(!isValid(workBoard,r,c,v)) return;
    }

  msg.textContent="Gratulacje! Poprawne rozwiązanie!";
  beep(1300);
}
</script>

</body>
</html>
