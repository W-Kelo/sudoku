<!DOCTYPE html>
<html>
<head>
 <link rel="icon" type="image/png" href="favicon.png">
<meta charset="UTF-8">
<title>Sudoku 18×18 – tryb rozwiązywania, wersja beta</title>

<style>

:root{
  --bg:#eef1f7;
  --fg:#222;
  --board-bg:white;
  --good:#c8facc;
  --bad:#ffd4d4;
  --overlay:rgba(255,255,255,0.82);
}

/* ====== layout ====== */

body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
}

/* animowane tło */
#bgAnim{
  position:fixed;
  inset:0;
  z-index:-1;
}

#layout{
  display:grid;
  grid-template-columns: 280px 1fr;
  width:100%;
  height:100%;
}

/* ====== tools column ====== */

#tools{
  border-right:1px solid #ccc;
  padding:12px;
  overflow-y:auto;
}

.tool-group{
  margin-bottom:14px;
  padding-bottom:9px;
  border-bottom:1px solid #ddd;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#007BFF;
  color:white;
  cursor:pointer;
  margin-top:4px;
  width:100%;
}

/* ====== board column ====== */

#boardCol{
  position:relative;
  overflow:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* powiększana plansza */
#boardWrap{
  transform-origin: top left;
  transition: transform .15s ease;
}

/* blur + mleczna plansza */
#boardOverlay{
  position:absolute;
  top:0;
  left:0;
  right:0;
  bottom:0;
  backdrop-filter: blur(7px);
  background:var(--overlay);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  z-index:3;
  font-weight:bold;
}

#boardOverlay.hidden{
  display:none;
}

/* sudoku */

table{
  border-collapse:collapse;
  background:var(--board-bg);
}

td{
  border:1px solid #888;
  position:relative;
  width:38px;
  height:38px;
}

input{
  width:100%;
  height:100%;
  border:none;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  background:transparent;
}

input.ok{background:var(--good);}
input.bad{background:var(--bad);}

.bold-r{border-right:3px solid black;}
.bold-b{border-bottom:3px solid black;}

/* ===== toast ===== */

#toasts{
  position:fixed;
  right:15px;
  bottom:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:10;
}

.toast{
  padding:10px 14px;
  background:#333;
  color:white;
  border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  opacity:.95;
}

/* ===== modal ===== */

#modalOverlay,
#loadSaveModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:30;
}

.modalBox{
  background:white;
  border-radius:12px;
  padding:18px 22px;
  max-width:420px;
  text-align:center;
}

/* ===== responsive ===== */

@media(max-width:900px){
  #layout{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }
  #tools{
    border-right:none;
    border-bottom:1px solid #ccc;
  }
}
</style>
</head>

<body>

<canvas id="bgAnim"></canvas>

<div id="layout">

  <div id="tools">

    <h2>Narzędzia</h2>

    <div class="tool-group">
      <button id="start">Start czasu</button>
      <button id="stop">Stop czasu</button>
      <div id="timer">00:00</div>
    </div>

    <div class="tool-group">
      <button id="modeInstant">Tryb: sprawdzaj od razu</button>
      <button id="modeLater">Tryb: najpierw rozwiąż</button>
    </div>

    <div class="tool-group">
      <button id="hint">Podpowiedź</button>
      <button id="hint10">Podpowiedz 10</button>
    </div>

    <div class="tool-group">
      <button id="zoomIn">Powiększ</button>
      <button id="zoomOut">Pomniejsz</button>
      <button id="zoomReset">Reset powiększenia</button>
    </div>

    <div class="tool-group">
      <button id="save">Zapisz stan gry</button>
    </div>

    <div class="tool-group">
      <button id="sound">Dźwięk: włączony</button>
    </div>

    <div id="msg"></div>

  </div>

  <div id="boardCol">

    <div id="boardOverlay">Rozpocznij czas aby grać</div>

    <div id="boardWrap">
      <table id="board"></table>
    </div>

  </div>

</div>

<!-- toast -->
<div id="toasts"></div>

<!-- gratulacje modal -->
<div id="modalOverlay">
  <div class="modalBox">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<!-- load save modal -->
<div id="loadSaveModal">
  <div class="modalBox">
    <h3>Znaleziono zapisany stan gry</h3>
    <p id="loadSaveText"></p>
    <button id="btnLoadSave">Załaduj</button>
    <button onclick="closeLoadSave()">Anuluj</button>
  </div>
</div>

<script>

/* ========= UTILS ========= */

function toast(text){
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=text;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

function randomToast(arr){
  toast(arr[Math.floor(Math.random()*arr.length)]);
}

function openModal(title,text){
  modalTitle.textContent=title;
  modalText.textContent=text;
  modalOverlay.style.display="flex";
}

function closeModal(){
  modalOverlay.style.display="none";
}

/* ========= ANIMOWANE TŁO ========= */

const cvs=document.getElementById("bgAnim");
const ctx=cvs.getContext("2d");

function resizeCanvas(){
  cvs.width=innerWidth;
  cvs.height=innerHeight;
}
resizeCanvas();
addEventListener("resize",resizeCanvas);

const bubbles=[...Array(25)].map(()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:20+Math.random()*40,
  s:0.3+Math.random()*0.6
}));

function drawBg(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  bubbles.forEach(b=>{
    ctx.fillStyle="rgba(120,170,255,.15)";
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    b.y-=b.s;
    if(b.y<-50) b.y=innerHeight+50;
  });
  requestAnimationFrame(drawBg);
}
drawBg();

/* ========= INPUT DATA ========= */

function get(name){
  return new URLSearchParams(location.search).get(name);
}

const initialBoard = JSON.parse(get("board"));
const workBoard = JSON.parse(JSON.stringify(initialBoard));

/* ========= SAVE CHECK ========= */

function showLoadSaveModal(dateString){
  loadSaveText.textContent="Zapis wykonano: "+dateString;
  loadSaveModal.style.display="flex";
}
function closeLoadSave(){
  loadSaveModal.style.display="none";
}

(function checkSavedGame(){
  const raw=localStorage.getItem("sudoku18_state");
  const date=localStorage.getItem("sudoku18_state_date");
  if(!raw) return;

  const d = date ? new Date(date).toLocaleString() : "nieznany czas";
  showLoadSaveModal(d);

  btnLoadSave.onclick=()=>{
    const saved=JSON.parse(raw);
    for(let r=0;r<18;r++)
      for(let c=0;c<18;c++)
        workBoard[r][c]=saved[r][c];

    for(let r=0;r<18;r++)
      for(let c=0;c<18;c++){
        const inp=table.rows?.[r]?.cells?.[c]?.firstChild;
        if(!inp) continue;
        if(initialBoard[r][c]===0)
          inp.value = workBoard[r][c]===0 ? "" : workBoard[r][c];
      }

    closeLoadSave();
    toast("Stan gry załadowany");
  };
})();

/* ========= TIMER ========= */

let seconds=0,timerInt=null,started=false;

function updateTimer(){
  seconds++;
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

start.onclick=()=>{
  if(!timerInt){
    timerInt=setInterval(updateTimer,1000);
    started=true;
    boardOverlay.classList.add("hidden");

    const now=new Date();
    const h=now.getHours()+now.getMinutes()/60;

    if(h>=5.5 && h<10)
      randomToast(["Poranna rozgrzewka","Czas rozgrzać mózg!"]);
    else if(h>=10 && h<14)
      randomToast(["Rozwiąż sudoku przed obiadem!"]);
    else if(h>=14 && h<18)
      randomToast(["Odpocznij z sudoku!"]);
    else if(h>=18 && h<22)
      randomToast(["Sudoku wieczorem - odprężenie przed snem","Odpocznij z sudoku"]);
    else
      randomToast(["Noc z sudoku - doskonałe połączenie"]);
  }
};

stop.onclick=()=>{
  clearInterval(timerInt);
  timerInt=null;
  boardOverlay.textContent="Czas zatrzymany";
  boardOverlay.classList.remove("hidden");
  randomToast(["Wróć szybko!","Czekamy!","Do zobaczenia!"]);
};

/* ========= AUDIO ========= */

let audioCtx;
let soundEnabled=true;

sound.onclick=()=>{
  soundEnabled=!soundEnabled;
  sound.textContent= soundEnabled ? "Dźwięk: włączony" : "Dźwięk: wyłączony";
};

function beep(freq){
  if(!soundEnabled) return;

  if(!audioCtx)
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  if(audioCtx.state==="suspended")
    audioCtx.resume();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.2);
}

/* ========= LOGIKA ========= */

function isValid(board,r,c,val){
  for(let i=0;i<18;i++)
    if(board[r][i]===val && i!==c) return false;

  for(let i=0;i<18;i++)
    if(board[i][c]===val && i!==r) return false;

  const br=Math.floor(r/3)*3;
  const bc=Math.floor(c/6)*6;

  for(let i=0;i<3;i++)
    for(let j=0;j<6;j++){
      const rr=br+i,cc=bc+j;
      if(board[rr][cc]===val && !(rr===r&&cc===c))
        return false;
    }

  return true;
}

/* ========= RYSOWANIE PLANSZY ========= */

const table=document.getElementById("board");

for(let r=0;r<18;r++){
  const tr=document.createElement("tr");

  for(let c=0;c<18;c++){
    const td=document.createElement("td");

    if((c+1)%6===0 && c<17) td.classList.add("bold-r");
    if((r+1)%3===0 && r<17) td.classList.add("bold-b");

    const input=document.createElement("input");

    if(initialBoard[r][c]!==0){
      input.value=initialBoard[r][c];
      input.disabled=true;
    } else {
      input.addEventListener("input",()=>onInput(r,c,input));
    }

    td.appendChild(input);
    tr.appendChild(td);
  }

  table.appendChild(tr);
}

/* ========= TRYBY ========= */

let mode="later";

modeInstant.onclick=()=>{
  mode="instant";
  toast("Tryb: sprawdzaj od razu");
};

modeLater.onclick=()=>{
  mode="later";
  toast("Tryb: najpierw rozwiąż");
};

/* ========= PODPOWIEDZI ========= */

const hintedCells = new Set();

function refreshHints(){
  hintedCells.forEach(key=>{
    const [r,c]=key.split(",").map(Number);

    for(let v=1;v<=18;v++){
      if(isValid(workBoard,r,c,v)){
        workBoard[r][c]=v;
        const inp=table.rows[r].cells[c].firstChild;
        inp.value=v;
        inp.classList.add("ok");
        break;
      }
    }
  });
}

/* ========= INPUT ========= */

function onInput(r,c,input){

  if(!started){
    boardOverlay.textContent="Rozpocznij czas aby grać";
    boardOverlay.classList.remove("hidden");
    input.value="";
    return;
  }

  let v=input.value.trim();
  if(v===""){workBoard[r][c]=0;return;}

  if(!/^[0-9]{1,2}$/.test(v)){input.value="";return;}

  const num=parseInt(v);
  if(num<1||num>18){input.value="";return;}

  workBoard[r][c]=num;

  if(mode==="instant"){
    if(isValid(workBoard,r,c,num)){
      input.classList.add("ok");
      input.classList.remove("bad");
      beep(900);
      randomToast(["Super!","Gratulacje!","Doskonale!","Rewelacja!","Wspaniale","Bezbłędnie!","Mistrzowsko!","Wybitnie"]);
    } else {
      input.classList.add("bad");
      input.classList.remove("ok");
      beep(200);
      randomToast(["Nie poddawaj się!","Nic się nie stało!","Następnym razem Ci się uda!"]);
    }
  }

  refreshHints();
  checkFinished();
}

/* ========= ZOOM ========= */

let zoom=1;

zoomIn.onclick=()=>{
  zoom*=1.25;
  boardWrap.style.transform=`scale(${zoom})`;
};

zoomOut.onclick=()=>{
  zoom/=1.25;
  boardWrap.style.transform=`scale(${zoom})`;
};

zoomReset.onclick=()=>{
  zoom=1;
  boardWrap.style.transform="scale(1)";
  boardCol.scrollTop=0;
  boardCol.scrollLeft=0;
};

/* ========= PODPOWIEDŹ 1 ========= */

hint.onclick=()=>{

  const empty=[];

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++)
      if(workBoard[r][c]===0)
        empty.push([r,c]);

  if(!empty.length){
    toast("Brak pustych pól");
    return;
  }

  const [r,c]=empty[Math.floor(Math.random()*empty.length)];

  for(let v=1;v<=18;v++){
    if(isValid(workBoard,r,c,v)){
      workBoard[r][c]=v;
      const inp=table.rows[r].cells[c].firstChild;
      inp.value=v;
      inp.classList.add("ok");
      hintedCells.add(`${r},${c}`);
      beep(1000);
      break;
    }
  }

  refreshHints();
  checkFinished();
};

/* ========= PODPOWIEDŹ 10 ========= */

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

hint10.onclick=()=>{

  const free=[];
  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++)
      if(workBoard[r][c]===0)
        free.push([r,c]);

  if(free.length<10){
    hint10.style.display="none";
    return;
  }

  shuffle(free);

  let added=0;
  for(const [r,c] of free){
    for(let v=1;v<=18;v++){
      if(isValid(workBoard,r,c,v)){
        workBoard[r][c]=v;
        const inp=table.rows[r].cells[c].firstChild;
        inp.value=v;
        inp.classList.add("ok");
        hintedCells.add(`${r},${c}`);
        added++;
        break;
      }
    }
    if(added>=10) break;
  }

  toast("Dodano 10 podpowiedzi");
  refreshHints();
  checkFinished();
};

/* ========= SAVE ========= */

save.onclick=()=>{
  localStorage.setItem("sudoku18_state",JSON.stringify(workBoard));
  localStorage.setItem("sudoku18_state_date", new Date().toISOString());
  randomToast(["Dobry pomysł!","Do zobaczenia!"]);
};

/* ========= SPRAWDZENIE KOŃCA ========= */

function checkFinished(){

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++){
      const v=workBoard[r][c];
      if(v===0) return;
      if(!isValid(workBoard,r,c,v)) return;
    }

  beep(1300);
  randomToast(["Jesteś mistrzem!","Super!","Gratulacje!"]);

  openModal(
    "Gratulacje ",
    "Rozwiązałeś poprawnie sudoku 18×18!"
  );
}
</script>
</body>
</html>
