<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="favicon.png">
<title>Sudoku 18x18 – rozwiązywanie, wersja beta</title>

<style>

:root{
  --bg:#eef1f7;
  --fg:#111;
  --overlay:rgba(255,255,255,.83);
  --ok:#c8facc;
  --bad:#ffd6d6;
}

body{
  margin:0;
  font-family: Arial,Helvetica,sans-serif;
  color:var(--fg);
  background:var(--bg);
  height:100vh;
  display:flex;
}

#layout{
  display:grid;
  width:100%;
  height:100%;
  grid-template-columns:280px 1fr;
}

/* ---------------- TOOLS COLUMN ---------------- */

#tools{
  border-right:1px solid #ccc;
  padding:12px;
  overflow-y:auto;
}

.tool-group{
  border-bottom:1px solid #ddd;
  padding-bottom:8px;
  margin-bottom:12px;
}

button{
  width:100%;
  border:none;
  padding:8px 10px;
  background:#007bff;
  color:white;
  border-radius:8px;
  cursor:pointer;
  margin-top:4px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ---------------- BOARD COLUMN ---------------- */

#boardCol{
  position:relative;
  overflow:auto;
}

#boardWrap{
  transform-origin:top left;
  transition:transform .15s ease;
  display:inline-block;
}

#boardOverlay{
  position:absolute;
  inset:0;
  backdrop-filter:blur(7px);
  background:var(--overlay);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  z-index:3;
}

#boardOverlay.hidden{
  display:none;
}

/* ---------------- TABLE ---------------- */

table{
  border-collapse:collapse;
  margin:26px;
  background:white;
}

td{
  width:40px;
  height:40px;
  border:1px solid #777;
  position:relative;
}

.bold-r{border-right:3px solid #000;}
.bold-b{border-bottom:3px solid #000;}

input{
  width:100%;
  height:100%;
  border:none;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  background:transparent;
}

input.ok{background:var(--ok);}
input.bad{background:var(--bad);}

/* ---------------- TOAST ---------------- */

#toasts{
  position:fixed;
  right:15px;
  bottom:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:40;
}

.toast{
  padding:9px 12px;
  border-radius:9px;
  background:#222;
  color:white;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}

/* ---------------- MODAL ---------------- */

#modalOverlay,
#loadSaveModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:50;
}

.modalBox{
  background:white;
  border-radius:14px;
  padding:18px 20px;
  max-width:420px;
  text-align:center;
}

/* ---------------- RESPONSIVE ---------------- */

@media(max-width:900px){
  #layout{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
  }
  #tools{
    border-right:none;
    border-bottom:1px solid #ddd;
  }
}

</style>
</head>

<body>

<canvas id="bgAnim"></canvas>

<div id="layout">

  <div id="tools">

    <h2>Narzędzia</h2>

    <div class="tool-group">
      <button id="start">Start czasu</button>
      <button id="stop">Stop czasu</button>
      <div id="timer">00:00</div>
    </div>

    <div class="tool-group">
      <button id="modeInstant">Tryb: sprawdzaj od razu</button>
      <button id="modeLater">Tryb: najpierw rozwiąż</button>
    </div>

    <div class="tool-group">
      <button id="hint">Podpowiedź</button>
      <button id="hint10">Podpowiedz 10</button>
      <button id="refreshHintsBtn">Zaktualizuj podpowiedzi</button>
    </div>

    <div class="tool-group">
      <button id="zoomIn">Powiększ</button>
      <button id="zoomOut">Pomniejsz</button>
      <button id="zoomReset">Reset powiększenia</button>
    </div>

    <div class="tool-group">
      <button id="save">Zapisz stan gry</button>
    </div>

    <div class="tool-group">
      <button id="sound">Dźwięk: włączony</button>
    </div>

  </div>

  <div id="boardCol">

    <div id="boardOverlay">Rozpocznij czas aby grać</div>

    <div id="boardWrap">
      <table id="board"></table>
    </div>

  </div>

</div>

<!-- TOAST -->
<div id="toasts"></div>

<!-- GRATULACJE -->
<div id="modalOverlay">
  <div class="modalBox">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button onclick="closeModal()">OK</button>
  </div>
</div>

<!-- LOAD SAVE MODAL -->
<div id="loadSaveModal">
  <div class="modalBox">
    <h3>Znaleziono zapisany stan gry</h3>
    <p id="loadSaveText"></p>
    <button id="btnLoadSave">Załaduj</button>
    <button onclick="closeLoadSave()">Anuluj</button>
  </div>
</div>

<script>
/* ------------------ UTILS ------------------ */

function toast(text){
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=text;
  toasts.appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

function randomToast(arr){
  toast(arr[Math.floor(Math.random()*arr.length)]);
}

function openModal(t,x){
  modalTitle.textContent=t;
  modalText.textContent=x;
  modalOverlay.style.display="flex";
}

function closeModal(){
  modalOverlay.style.display="none";
}

/* ------------------ BACKGROUND ------------------ */

const cvs=document.getElementById("bgAnim");
const ctx=cvs.getContext("2d");

function resizeCanvas(){
  cvs.width=innerWidth;
  cvs.height=innerHeight;
}
resizeCanvas();
addEventListener("resize",resizeCanvas);

const bubbles=[...Array(26)].map(()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  r:20+Math.random()*40,
  s:0.3+Math.random()*0.6
}));

(function animBg(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  bubbles.forEach(b=>{
    ctx.fillStyle="rgba(120,160,255,.16)";
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    b.y-=b.s;
    if(b.y<-50) b.y=innerHeight+50;
  });
  requestAnimationFrame(animBg);
})();

/* ------------------ URL BOARD INPUT ------------------ */

function get(name){
  return new URLSearchParams(location.search).get(name);
}

const initialBoard = JSON.parse(get("board"));
const workBoard = JSON.parse(JSON.stringify(initialBoard));

/* ------------------ SAVE SYSTEM ------------------ */

function showLoadSaveModal(dateString){
  loadSaveText.textContent="Zapis wykonano: "+dateString;
  loadSaveModal.style.display="flex";
}
function closeLoadSave(){
  loadSaveModal.style.display="none";
}

(function checkSavedGame(){
  const raw=localStorage.getItem("sudoku18_state");
  const date=localStorage.getItem("sudoku18_state_date");
  if(!raw) return;

  const d = date ? new Date(date).toLocaleString() : "nieznany czas";
  showLoadSaveModal(d);

  btnLoadSave.onclick=()=>{
    const saved=JSON.parse(raw);

    for(let r=0;r<18;r++)
      for(let c=0;c<18;c++)
        workBoard[r][c]=saved[r][c];

    redrawInputs();
    closeLoadSave();
    toast("Stan gry załadowany");
  };
})();

/* ------------------ TIMER ------------------ */

let seconds=0,timerInt=null,started=false;

function updateTimer(){
  seconds++;
  const m=Math.floor(seconds/60);
  const s=seconds%60;
  timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

start.onclick=()=>{

  if(timerInt) return;

  timerInt=setInterval(updateTimer,1000);
  started=true;

  boardOverlay.classList.add("hidden");

  document.querySelectorAll("#board input").forEach(inp=>{
    if(inp.dataset.given==="0") inp.disabled=false;
  });

  const now=new Date();
  const h=now.getHours()+now.getMinutes()/60;
  if(h>=5.5 && h<10) randomToast(["Poranna rozgrzewka","Czas rozgrzać mózg!"]);
  else if(h>=10 && h<14) randomToast(["Rozwiąż sudoku przed obiadem!"]);
  else if(h>=14 && h<18) randomToast(["Odpocznij z sudoku!"]);
  else if(h>=18 && h<22) randomToast(["Sudoku wieczorem - odprężenie przed snem","Odpocznij z sudoku"]);
  else randomToast(["Noc z sudoku - doskonałe połączenie"]);
};

stop.onclick=()=>{

  if(!timerInt) return;

  clearInterval(timerInt);
  timerInt=null;

  boardOverlay.textContent="Czas zatrzymany";
  boardOverlay.classList.remove("hidden");

  document.querySelectorAll("#board input").forEach(inp=>{
    inp.disabled=true;
  });

  randomToast(["Wróć szybko!","Czekamy!","Do zobaczenia!"]);
};

/* ------------------ AUDIO ------------------ */

let audioCtx;
let soundEnabled=true;

sound.onclick=()=>{
  soundEnabled=!soundEnabled;
  sound.textContent = soundEnabled ? "Dźwięk: włączony" : "Dźwięk: wyłączony";
};

function beep(freq){
  if(!soundEnabled) return;
  audioCtx ??= new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.2);
}

/* ------------------ LOGIC ------------------ */

function isValid(board,r,c,val){

  for(let i=0;i<18;i++)
    if(board[r][i]===val && i!==c) return false;

  for(let i=0;i<18;i++)
    if(board[i][c]===val && i!==r) return false;

  const br=Math.floor(r/3)*3;
  const bc=Math.floor(c/6)*6;

  for(let i=0;i<3;i++)
    for(let j=0;j<6;j++){
      const rr=br+i,cc=bc+j;
      if(board[rr][cc]===val && !(rr===r&&cc===c))
        return false;
    }

  return true;
}

/* ------------------ TABLE DRAW ------------------ */

const table=document.getElementById("board");

function redrawInputs(){

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++){
      const inp=table.rows[r].cells[c].firstChild;

      if(initialBoard[r][c]!==0){
        inp.value=initialBoard[r][c];
        inp.disabled=true;
        inp.dataset.given="1";
      } else {
        inp.value = workBoard[r][c]===0 ? "" : workBoard[r][c];
        inp.dataset.given="0";
      }
    }
}

for(let r=0;r<18;r++){
  const tr=document.createElement("tr");

  for(let c=0;c<18;c++){

    const td=document.createElement("td");
    if((c+1)%6===0 && c<17) td.classList.add("bold-r");
    if((r+1)%3===0 && r<17) td.classList.add("bold-b");

    const input=document.createElement("input");

    if(initialBoard[r][c]!==0){
      input.value=initialBoard[r][c];
      input.disabled=true;
      input.dataset.given="1";
    }else{
      input.value="";
      input.disabled=true;
      input.dataset.given="0";
      input.addEventListener("input",()=>onInput(r,c,input));
    }

    td.appendChild(input);
    tr.appendChild(td);
  }
  table.appendChild(tr);
}

/* ------------------ MODES ------------------ */

let mode="later";

modeInstant.onclick=()=>{
  mode="instant";
  toast("Tryb: sprawdzaj od razu");
};

modeLater.onclick=()=>{
  mode="later";
  toast("Tryb: najpierw rozwiąż");
};

/* ------------------ INPUT HANDLING ------------------ */

const hintedCells = new Set();

function refreshHints(){

  hintedCells.forEach(key=>{
    const [r,c]=key.split(",").map(Number);

    if(initialBoard[r][c]!==0) return;

    for(let v=1;v<=18;v++){
      if(isValid(workBoard,r,c,v)){
        workBoard[r][c]=v;
        const inp=table.rows[r].cells[c].firstChild;
        inp.value=v;
        inp.classList.add("ok");
        break;
      }
    }
  });
}

refreshHintsBtn.onclick=()=>{
  refreshHints();
  toast("Podpowiedzi zaktualizowane");
};

function onInput(r,c,input){

  if(!started){
    boardOverlay.classList.remove("hidden");
    input.value="";
    return;
  }

  let v=input.value.trim();
  if(v===""){workBoard[r][c]=0;return;}
  if(!/^[0-9]{1,2}$/.test(v)){input.value="";return;}

  const num=parseInt(v);
  if(num<1||num>18){input.value="";return;}

  workBoard[r][c]=num;

  if(mode==="instant"){

    if(isValid(workBoard,r,c,num)){
      input.classList.add("ok");
      input.classList.remove("bad");
      beep(950);
      randomToast(["Super!","Gratulacje!","Doskonale!","Rewelacja!","Wspaniale","Bezbłędnie!","Mistrzowsko!","Wybitnie"]);
    } else {
      input.classList.add("bad");
      input.classList.remove("ok");
      beep(200);
      randomToast(["Nie poddawaj się!","Nic się nie stało!","Następnym razem Ci się uda!"]);
    }
  }

  refreshHints();
  checkFinished();
}

/* ------------------ HINTS ------------------ */

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

hint.onclick=()=>{

  const free=[];

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++)
      if(workBoard[r][c]===0)
        free.push([r,c]);

  if(!free.length){toast("Brak pustych pól");return;}

  const [r,c]=free[Math.floor(Math.random()*free.length)];

  for(let v=1;v<=18;v++){
    if(isValid(workBoard,r,c,v)){
      workBoard[r][c]=v;
      const inp=table.rows[r].cells[c].firstChild;
      inp.value=v;
      inp.classList.add("ok");
      hintedCells.add(`${r},${c}`);
      beep(1100);
      break;
    }
  }

  refreshHints();
  checkFinished();
};

hint10.onclick=()=>{

  const free=[];
  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++)
      if(workBoard[r][c]===0)
        free.push([r,c]);

  if(free.length<10){
    hint10.style.display="none";
    return;
  }

  shuffle(free);

  let added=0;

  for(const [r,c] of free){

    for(let v=1;v<=18;v++){
      if(isValid(workBoard,r,c,v)){
        workBoard[r][c]=v;
        const inp=table.rows[r].cells[c].firstChild;
        inp.value=v;
        inp.classList.add("ok");
        hintedCells.add(`${r},${c}`);
        added++;
        break;
      }
    }

    if(added>=10) break;
  }

  toast("Dodano 10 podpowiedzi");
  refreshHints();
  checkFinished();
};

/* ------------------ ZOOM ------------------ */

let zoom=1;

zoomIn.onclick=()=>{
  zoom*=1.25;
  boardWrap.style.transform=`scale(${zoom})`;
};

zoomOut.onclick=()=>{
  zoom/=1.25;
  boardWrap.style.transform=`scale(${zoom})`;
};

zoomReset.onclick=()=>{
  zoom=1;
  boardWrap.style.transform="scale(1)";
  boardCol.scrollTop=0;
  boardCol.scrollLeft=0;
};

/* ------------------ SAVE ------------------ */

save.onclick=()=>{
  localStorage.setItem("sudoku18_state",JSON.stringify(workBoard));
  localStorage.setItem("sudoku18_state_date", new Date().toISOString());
  randomToast(["Dobry pomysł!","Do zobaczenia!"]);
};

/* ------------------ FINISH CHECK ------------------ */

function checkFinished(){

  for(let r=0;r<18;r++)
    for(let c=0;c<18;c++){
      const v=workBoard[r][c];
      if(v===0) return;
      if(!isValid(workBoard,r,c,v)) return;
    }

  beep(1400);

  randomToast(["Jesteś mistrzem!","Super!","Gratulacje!"]);

  openModal("Gratulacje","Rozwiązałeś poprawnie sudoku 18×18!");
}

</script>
</body>
</html>
