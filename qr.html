<!doctype html>
<html lang="pl">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skaner kodów Kelo Sudoku</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
    video{max-width:100%;height:auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
    #output{min-height:48px;padding:8px;border-radius:8px;background:#f7f7f8;width:100%;max-width:720px;word-break:break-word}
    canvas{display:none}
    .controls{display:flex;gap:8px}
    button{padding:8px 12px;border-radius:6px;border:1px solid #ccc;background:white;cursor:pointer}
  </style>
</head>

<body>
<h3>Zeskanuj kod QR lub kod paskowy sudoku</h3>

<div style="position:relative;max-width:720px;width:100%">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay" style="position:absolute;left:0;top:0;pointer-events:none"></canvas>
</div>

<div class="controls">
  <button id="start">Start</button>
  <button id="stop">Stop</button>
</div>

<div id="output">Kod: <span id="result">—</span></div>
<canvas id="hiddenCanvas"></canvas>

<!-- Biblioteki -->
<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.js"></script>

<footer style="margin-top:40px;padding:16px 8px;text-align:center;font-size:0.9em;color:#555;border-top:1px solid #ddd;">
  © Wydawnictwo Kelo <span id="year"></span>
</footer>

<script>
/* ====== ELEMENTY ====== */
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const hiddenCanvas = document.getElementById('hiddenCanvas');
const resultEl = document.getElementById('result');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
document.getElementById("year").textContent = new Date().getFullYear();

/* ====== STAN ====== */
let stream = null;
let rafId = null;
let barcodeLocked = false;
let quaggaStarted = false;

/* ====== KAMERA ====== */
async function startCamera(){
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},
    audio:false
  });
  video.srcObject = stream;
  await video.play();

  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  hiddenCanvas.width = video.videoWidth;
  hiddenCanvas.height = video.videoHeight;

  scanLoop();
}

function stopCamera(){
  if (stream){
    stream.getTracks().forEach(t=>t.stop());
    stream = null;
  }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  stopQuagga();
  barcodeLocked = false;
  resultEl.textContent = '—';
  overlay.getContext('2d').clearRect(0,0,overlay.width,overlay.height);
}

/* ====== QUAGGA – CODE 128 ====== */
function startQuagga(){
  if (quaggaStarted) return;
  quaggaStarted = true;

  Quagga.init({
    inputStream:{
      type:"LiveStream",
      target:video,
      constraints:{facingMode:"environment"}
    },
    decoder:{
      readers:["code_128_reader"]
    },
    locate:true
  }, err=>{
    if(!err) Quagga.start();
  });

  Quagga.onDetected(data=>{
    if (barcodeLocked) return;
    barcodeLocked = true;

    const code = data.codeResult.code;
    resultEl.textContent = code;
    navigator.clipboard.writeText(code).catch(()=>{});

    window.location.href ='https://w-kelo.github.io/sudoku/?kelo=' + encodeURIComponent(data.codeResult.code);

    stopQuagga();
  });
}

function stopQuagga(){
  if (quaggaStarted){
    Quagga.stop();
    quaggaStarted = false;
  }
}

/* ====== QR SCAN LOOP ====== */
function scanLoop(){
  const ctx = hiddenCanvas.getContext('2d');
  const overlayCtx = overlay.getContext('2d');

  function tick(){
    if (!video.videoWidth){
      rafId = requestAnimationFrame(tick);
      return;
    }

    ctx.drawImage(video,0,0,hiddenCanvas.width,hiddenCanvas.height);
    const img = ctx.getImageData(0,0,hiddenCanvas.width,hiddenCanvas.height);
    const qr = jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});

    overlayCtx.clearRect(0,0,overlay.width,overlay.height);

    if (qr){
      stopQuagga();
      barcodeLocked = true;

      const l = qr.location;
      draw(l.topLeftCorner,l.topRightCorner);
      draw(l.topRightCorner,l.bottomRightCorner);
      draw(l.bottomRightCorner,l.bottomLeftCorner);
      draw(l.bottomLeftCorner,l.topLeftCorner);

      resultEl.textContent = qr.data;
      navigator.clipboard.writeText(qr.data).catch(()=>{});

      window.location.href =
        'https://w-kelo.github.io/sudoku/?kelo=' + encodeURIComponent(qr.data);
    } else {
      startQuagga();
    }

    rafId = requestAnimationFrame(tick);
  }

  function draw(a,b){
    overlayCtx.beginPath();
    overlayCtx.moveTo(a.x,a.y);
    overlayCtx.lineTo(b.x,b.y);
    overlayCtx.lineWidth=4;
    overlayCtx.strokeStyle='#FF3B58';
    overlayCtx.stroke();
  }

  tick();
}

/* ====== KONTROLKI ====== */
startBtn.onclick = startCamera;
stopBtn.onclick = stopCamera;
</script>
</body>
</html>
